<section class="book-editor">
  @if (errMessage()) {
    <p class="book-error" role="alert">{{ errMessage() }}</p>
  }

  <form #bookForm="ngForm" (ngSubmit)="putBook(bookForm)" novalidate>
    <div class="book-fields">
      <label for="updateBookId">Book Id:</label>
      <input
        id="updateBookId"
        class="form-control"
        name="BookId"
        [(ngModel)]="book.BookId"
        readonly
        required
      />

      <label for="updateBookName">Book Name:</label>
      <input
        id="updateBookName"
        class="form-control"
        name="BookName"
        [(ngModel)]="book.BookName"
        required
      />

      <label for="updateBookPrice">Price:</label>
      <input
        id="updateBookPrice"
        class="form-control"
        type="number"
        name="Price"
        [(ngModel)]="book.Price"
        min="0"
        required
      />

      <label for="updateBookImage">Image:</label>
      <input
        id="updateBookImage"
        class="form-control"
        type="file"
        name="Image"
        accept="image/*"
        (change)="onFileSelected($event)"
      />
    </div>

    @if (book.Image) {
      <p>Ảnh hiện tại: {{ book.Image }}</p>
    }
    <button type="submit" [disabled]="isSubmitting() || !book.BookId">
      {{ isSubmitting() ? 'Updating...' : 'Submit Update' }}
    </button>
  </form>

  <table class="book-table">
    <thead>
      <tr>
        <th>BookId</th>
        <th>BookName</th>
        <th>Price</th>
        <th>Image</th>
      </tr>
    </thead>
    <tbody>
      @for (item of books(); track item.BookId) {
        <tr (click)="selectBook(item)" tabindex="0">
          <td>{{ item.BookId }}</td>
          <td>{{ item.BookName }}</td>
          <td>{{ item.Price }}</td>
          <td>
            @if (item.Image) {
              <img
                [src]="serverImagesLink + '/' + item.Image"
                [alt]="item.BookName"
                width="50"
                height="50"
              />
            }
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4">Not found books</td>
        </tr>
      }
    </tbody>
  </table>
</section>
