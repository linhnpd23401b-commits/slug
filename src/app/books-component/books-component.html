{{errMessage()}}
<table border="1">
  <thead>
    <tr>
      <th>Book ID</th>
      <th>Book Name</th>
      <th>Price</th>
      <th>Image</th>
    </tr>
  </thead>
  <tbody>
    @for (book of books(); track book.BookId) {
      <tr>
        <td>{{book.BookId}}</td>
        <td>{{book.BookName}}</td>
        <td>{{book.Price}}</td>
        <td>
          @if (book.Image) {
            <img [src]="serverImagesLink + '/' + book.Image" [alt]="book.BookName" width="50" height="50">
          } @else {
            <span>No image</span>
          }
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4">Not found books</td>
      </tr>
    }
  </tbody>
</table>
