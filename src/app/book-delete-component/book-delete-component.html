@if (errMessage()) {
  <p class="book-error" role="alert">{{ errMessage() }}</p>
}

<table class="book-table">
  <thead>
    <tr>
      <th>BookId</th>
      <th>BookName</th>
      <th>Price</th>
      <th>Image</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    @for (book of books(); track book.BookId) {
      <tr>
        <td>{{ book.BookId }}</td>
        <td>{{ book.BookName }}</td>
        <td>{{ book.Price }}</td>
        <td>
          @if (book.Image) {
            <img
              [src]="serverImagesLink + '/' + book.Image"
              [alt]="book.BookName"
              width="50"
              height="50"
            />
          }
        </td>
        <td>
          <button type="button" (click)="deleteBook(book.BookId)">Delete</button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5">Not found books</td>
      </tr>
    }
  </tbody>
</table>
