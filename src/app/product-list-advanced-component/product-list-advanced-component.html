<header class="slug-intro">
  <p>BÀI TẬP SLUG</p>
  <h1>Product & Fashion</h1>
  <nav aria-label="Nội dung bài slug"><a href="#product-slug">Slug sản phẩm</a><a href="#fashion-slug">Slug Fashion</a></nav>
</header>
<h2 id="product-slug">Danh sách sản phẩm</h2>
{{errMessage()}}
<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Details</th>
      <th>Slug</th>
    </tr>
  </thead>

  <tbody>
    @for (p of products(); track p.id) {
    <tr>
      <td>{{ p.id }}</td>
      <td>{{ p.name }}</td>
      <td>{{ p.price }}</td>
      <td>
        <a (click)="viewDetail(p.id)"
        style="cursor: pointer;"
        title="click here to view detail">
          View detail</a>
      </td>
            <td>
        <a (click)="viewDetailSlug(p)"
        style="cursor: pointer;"
        title="click here to view detail" >
        {{generateSlug(p.name,p.id)}}
      </a>
      </td>

    </tr>
  } @empty {
    <tr>
      <td colspan="3">No products available.</td>
    </tr>
  }
  </tbody>
</table>
<router-outlet></router-outlet> 
<section id="fashion-slug" aria-label="Bổ sung slug Fashion">
  <app-fashion-component></app-fashion-component>
</section>
