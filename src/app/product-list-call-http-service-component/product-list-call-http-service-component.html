<p>product-list-call-http-service-component works!</p>
<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>NAME</th>
            <th>PRICE</th>
            <th>IMAGE</th>
        </tr>
    </thead>
    <tbody>
        @for (p of products(); track p.id) 
        {
            <tr>
                <td>{{p.id}}</td>
                <td>
                    <a routerLink="/products/{{p.id}}" target="_blank">
                        {{p.name}}
                    </a>
                </td>
                <td>{{p.price}}</td>
                <td><img [src]="p.image" [alt]="p.name" width="100" height="100"></td>
            </tr>
        }        
        @empty {
            <tr>
                <td colspan="4">Not Found Product!!!!</td>
            </tr>
        }
    </tbody>
</table>
